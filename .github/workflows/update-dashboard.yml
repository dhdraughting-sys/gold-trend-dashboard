name: Update Gold Trend Dashboard

# Runs on a schedule, builds the dashboard, and pushes it to the
# `gh-pages` branch. In your repo's Settings -> Pages, set:
#   Source: Deploy from a branch
#   Branch: gh-pages   /  (root)
# (Some accounts/orgs don't offer the "GitHub Actions" build-type source -
# this branch-based approach works everywhere, no matter which options
# your Settings -> Pages page shows.)
#
# You can also trigger a run manually from the Actions tab
# (workflow_dispatch, the "Run workflow" button).
#
# NOTE: GitHub disables scheduled workflows automatically after 60 days
# of repo inactivity. If your dashboard ever looks stale, go to the
# Actions tab and click "Run workflow" (or push any commit) to re-enable it.

on:
  schedule:
    # 12:00 UTC daily. Edit this to change frequency/time - crontab.guru
    # helps if you're not familiar with cron syntax. Don't go below
    # every 5 minutes; GitHub will silently throttle/skip runs that do.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas pillow

      - name: Build dashboard
        run: python gold_trends.py --output site/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
